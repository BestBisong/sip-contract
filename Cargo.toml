[package]
name = "stellar-invoice-protocol"
version = "0.1.0"
edition = "2021"
description = "Stellar Invoice Protocol - Soroban smart contract"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.11"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }
ed25519-dalek = "=2.1.0"

